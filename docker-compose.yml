services:
  mongo:
    image: mongo:4.0.4
    container_name: mongo
    hostname: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: LmNbGv4y77
    volumes:
      - ./data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo mongo:27017/test --quiet
    networks:
      - internal
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    ports:
      - "5002:5002"
    depends_on:
      - mongo
    labels:
      - traefik.enable=true
      - traefik.http.routers.vk-back.rule=Host(`api.valekstudio.com`)
      - traefik.http.routers.vk-back.tls=true
      - traefik.http.routers.vk-back.tls.certresolver=lets-encrypt
      - traefik.http.services.vk-back.loadbalancer.server.port=5002
    restart: unless-stopped
    networks:
      - traefik
      - internal

networks:
  internal:
    external: false
  traefik:
    external: true