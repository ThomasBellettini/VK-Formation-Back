services:
  traefik:
    container_name: traefik
    image: traefik:latest
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./reverse_proxy/traefik.toml:/traefik.toml
      - ./reverse_proxy/traefik_secure.toml:/traefik_secure.toml
      - ./reverse_proxy/acme.json:/acme.json
    networks:
      - traefik
    labels:
      - "traefik.docker.network=traefik"
  mongo:
    image: mongo:4.0.4
    container_name: mongo
    hostname: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: LmNbGv4y77
    volumes:
      - ./data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo mongo:27017/test --quiet
    networks:
      - internal
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    depends_on:
      - mongo
    labels:
      - traefik.enable=true
      - traefik.http.routers.vk-back.rule=Host(`test-back.valekstudio.com`)
      - traefik.http.routers.vk-back.tls=true
      - traefik.http.routers.vk-back.tls.certresolver=lets-encrypt
      - traefik.http.services.vk-back.loadbalancer.server.port=5002
      - traefik.http.services.vk-back.loadbalancer.server.forwardingTimeouts.readTimeout=600s
      - traefik.http.services.vk-back.loadbalancer.server.forwardingTimeouts.writeTimeout=600s
      - traefik.http.services.vk-back.loadbalancer.server.forwardingTimeouts.idleTimeout=600s
    restart: unless-stopped
    networks:
      - traefik
      - internal

networks:
  internal:
    external: false
  traefik:
    external: true
