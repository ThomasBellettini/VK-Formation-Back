services:
  mongo:
    image: mongo:4.0.4
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - ./data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo mongo:27017/test --quiet
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    ports:
      - "5002:5002"
    depends_on:
      - mongo
    restart: unless-stopped
