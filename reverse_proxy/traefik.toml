[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[entryPoints]
  [entryPoints.web]
    address = ":80"
    [entryPoints.web.http.redirections.entryPoint]
      to = "websecure"
      scheme = "https"

  [entryPoints.websecure]
    address = ":443"
    [entryPoints.websecure.transport.respondingTimeouts]
      idleTimeout = "6000s"
      readTimeout = "6000s"
      writeTimeout = "6000s"

[api]
  dashboard = true

[certificatesResolvers.lets-encrypt.acme]
  email = "contact@shurisko.fr"
  storage = "acme.json"
  [certificatesResolvers.lets-encrypt.acme.tlsChallenge]

[providers.docker]
  watch = true
  network = "traefik"

[providers.file]
  filename = "traefik_secure.toml"
