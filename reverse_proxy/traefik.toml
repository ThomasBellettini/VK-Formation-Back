[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[entryPoints]
  [entryPoints.web]
    address = ":80"
    [entryPoints.web.http.redirections.entryPoint]
      to = "websecure"
      scheme = "https"
  [entryPoints.websecure]
    address = ":443"
    [entryPoints.websecure.transport]
      [entryPoints.websecure.transport.respondingTimeouts]
        idleTimeout = 0s
        readTimeout = 0s
        writeTimeout = 0s

  [entryPoints.calls]
    address = ":8443/udp"

[api]
  dashboard = true
[certificatesResolvers.lets-encrypt.acme]
  email = "contact@shurisko.fr"
  storage = "acme.json"
  [certificatesResolvers.lets-encrypt.acme.tlsChallenge]

[providers.docker]
  watch = true
  network = "traefik"

[providers.file]
  filename = "traefik_secure.toml"
